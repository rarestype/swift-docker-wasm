name: Deploy

on:
    workflow_dispatch:
    #   We build semver tags, and the master branch.
    push:
        branches: [ master ]
        tags:
            -   '[0-9]+.[0-9]+.[0-9]+'

jobs:
    build:
        strategy:
            matrix:
                os:
                    -   dockerfile: 'Ubuntu.24.04'
                        display: 'Ubuntu 24.04'
                        suffix: '-noble'

                    -   dockerfile: 'Ubuntu.Latest'
                        display: 'Ubuntu'
                        suffix: ''

        name: ${{ matrix.os.display }}
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            attestations: write
            id-token: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Log in to Docker Hub
                uses: docker/login-action@master
                with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Extract Docker metadata
                uses: docker/metadata-action@master
                with:
                    images: tayloraswift/swiftwasm
                    flavor: |
                        latest=auto
                        prefix=
                        suffix=${{ matrix.os.suffix }}
                id: metadata

            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v4

            -   name: Set up Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Build and push Docker image
                id: push
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: ${{ matrix.os.dockerfile }}.Dockerfile
                    push: true
                    platforms: linux/amd64,linux/arm64
                    labels: ${{ steps.metadata.outputs.labels }}
                    tags: ${{ steps.metadata.outputs.tags }}

            #   Both matrix entries use the same Dockerfile, so only one of them
            #   needs to push the runner. Its `base` stage comes from the cache
            #   of the previous step.
            -   name: Build and push runner image
                if: matrix.os.suffix == ''
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: ${{ matrix.os.dockerfile }}.Dockerfile
                    target: runner
                    push: true
                    platforms: linux/amd64,linux/arm64
                    tags: tayloraswift/swiftwasm:runner
