# Defaults for everyone who runs tmux in this image, including through `cast`.

# Advertise 256 colors inside tmux, and pass true color through from terminals
# that support it.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# By default tmux waits half a second after Escape to see if it starts a key
# sequence, which makes Escape in Claude Code and other TUIs feel unresponsive.
set -s escape-time 10

set -g history-limit 50000
